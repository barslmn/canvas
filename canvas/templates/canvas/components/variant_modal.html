<dialog id="variantModal" x-bind:open="showVariantModal">
  <article style="width: 80vw; border-radius: 2em;">
    <header>
      <h3>{{ cnv.variant_id }}</h3>
      {% if success %}
        Successfully saved the classification.
      {% endif %}
      <a
        href="#"
        style="float:right; transform: translateY(-100%)"
        aria-label="Close"
        @click="showVariantModal = false"
      >
        <i class="fa-solid fa-xmark pico-color-red-500"></i>
      </a>
    </header>
    {% include "canvas/components/acmg_loss.html" %}
  </article>
</dialog>

<style>
  dialog article {
    max-width: unset;
  }
</style>

{% if success %}
  <script>
    table.updateData([
      {
        cnv_pk: "{{ cnv.pk }}",
        Classification:
          "{{ classification.classification_json.classification }}",
        total_score: "{{ classification.classification_json.total_score }}",
        classification_pk: "{{ classification.pk }}",
      },
    ]);
  </script>
{% endif %}
