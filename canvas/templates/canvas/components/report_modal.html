<dialog x-bind:open="showReportModal">
  <article>
    <header>
      <a
        href="#"
        style="float:right"
        aria-label="Close"
        @click="showReportModal = false"
      >
        <i class="fa-solid fa-xmark pico-color-red-500"></i>
      </a>
      <p>
        <strong> <i class="fa-regular fa-file-pdf"></i>{{ report }}</strong>
      </p>
    </header>
    <object
      x-bind:data="reportUrl"
      type="application/pdf"
      width="100%"
      height="840px"
    >
      <p>
        Unable to display PDF file.
        <a :href="reportUrl" download>Download</a> instead.
      </p>
    </object>
  </article>
</dialog>
