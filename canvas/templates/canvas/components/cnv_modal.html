<dialog id="CNVModal" x-bind:open="showCNVModal">
    <article style="width: 80vw; border-radius: 2em;">
        <header>

            {% if success %}
            Successfully saved the CNV.
            {% endif %}
        <a href="#" style="float:right; transform: translateY(-50%)" aria-label="Close"
        @click="showCNVModal = false; document.querySelector('#CNVModal').close()">
            <i class="fa-solid fa-xmark pico-color-red-500"></i>
        </a>
        
        </header>
         {% for roi in rois %}
            {{ roi }}
            {% endfor %}
    </article>
</dialog>
<style>
    dialog article {
        max-width: unset;
    }
    dialog.modal {
        border: none;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        padding: 1em;
    }
    dialog[open] {
        display: flex;
        justify-content: center;
        align-items: center;
    }
    dialog.hidden {
    display: none;
}
</style>

{% if success %}
<script>
    table.addData([
        {{ cnv }}
    ], true);
</script>
{% endif %}
