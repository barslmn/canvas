{% load static %}
{% load i18n %}
<!doctype html>
<html class="no-js" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <title>Canvas</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="icon"
      type="image/x-icon"
      href="{% static 'canvas/img/fav.ico' %}"
    />

    <script src="{% static 'vendor/htmx/htmx.min.js' %}"></script>
    <script defer src="{% static 'vendor/alpinejs/alpine.min.js' %}"></script>
    
    <link rel="stylesheet" href="{% static 'vendor/picocss/css/pico.min.css' %}">
    <link rel="stylesheet" href="{% static 'vendor/picocss/css/pico.colors.min.css' %}">

    <link rel="stylesheet" href="{% static 'vendor/fonts/inter-tight.css' %}">

    <script src="{% static 'vendor/split-grid/split-grid.js' %}"></script>

    <link defer rel="stylesheet" href="{% static 'vendor/tabulator/css/tabulator.min.css' %}">
    <script defer type="text/javascript" src="{% static 'vendor/tabulator/js/tabulator.min.js' %}"></script>

    <script defer src="{% static 'vendor/igv/igv.min.js' %}"></script>

    <script defer src="{% static 'vendor/fontawesome/js/all.min.js' %}"></script>

    {% block head %}
    {% endblock %}
    <script>
      (function () {
        const savedTheme = localStorage.getItem("theme");
        if (savedTheme) {
          document.documentElement.setAttribute("data-theme", savedTheme);
        }
      })();
    </script>

    <style>
      :root {
        --pico-typography-spacing-vertical: 0.5rem;
        --pico-form-element-spacing-vertical: 0.1rem;
        --pico-form-element-spacing-horizontal: 0.25rem;
        --pico-font-size: 0.8rem;
      }
      select {
        height: 2em;
      }
      .main {
        display: grid;
        grid-template-columns: 1fr 5px 11fr;
        grid-row-gap: 0.6em;
        justify-items: stretch;
        align-items: stretch;
      }

      .gutter-col {
        display: grid;
        grid-row: 1/-1;
        cursor: col-resize;
        justify-items: center;
        align-items: center;
      }

      .gutter-col-1 {
        grid-column: 2;
      }

      .sample-container {
        display: grid;
        grid-template-columns: 3fr 9fr;
        grid-column-gap: 0.6em;
        grid-row-gap: 0.6em;
        justify-items: stretch;
        align-items: stretch;
      }
      .evidence-container {
        display: grid;
        grid-template-columns: 1fr 11fr;
        grid-column-gap: 0.6em;
        grid-row-gap: 0.6em;
        justify-items: stretch;
        align-items: stretch;
        border-top-width: thin;
        border-top-style: solid;
      }
      .evidence-group {
        margin: auto;
      }

      .sample-search .dropdown > summary {
        height: unset !important;
        padding: 0 !important;
        border-radius: 2em !important;
      }
      details.dropdown summary::after {
        display: none;
      }

      .dropdown > summary input {
        margin: 0;
        background: transparent;
        border: none;
      }

      .dropdown > summary input:focus {
        box-shadow: none;
      }
      .badge {
        border-radius: 2em;
        padding: 0.2em 0.6em;
        display: inline-flex;
        align-items: center;
        gap: 0.3em;
        transform: translateY(-15%);
        margin-top: 5px;
      }
      .badge a {
        background: none;
        border: none;
        color: #888;
        line-height: 1;
        padding: 0;
        cursor: pointer;
        transition: color 0.3s ease;
      }
      .htmx-swapping {
        opacity: 0;
        transition: opacity 1s ease-out;
      }
      /* scrollbar */
      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }

      ::-webkit-scrollbar-track {
        -webkit-box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.3);
        -webkit-border-radius: 10px;
        border-radius: 10px;
      }

      ::-webkit-scrollbar-thumb {
        -webkit-border-radius: 10px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.3);
        -webkit-box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.5);
      }

      ::-webkit-scrollbar-thumb:window-inactive {
        background: rgba(255, 255, 255, 0.3);
      }
    </style>
  </head>
  <body style="font-family: Inter Tight">
    {% block content %}
    {% endblock %}
  </body>
</html>
