{% load static %}

<div class="notes-section" style="margin: 1em 0;">
  <h4>
    <i class="fa-solid fa-note-sticky"></i>
    Notes
  </h4>
  
  {% if object.notes.all %}
    {% for note in object.notes.all %}
      <article class="note" style="padding: 1em; margin: 0.5em 0; border-radius: 0.5em;">
        <div style="display: flex; justify-content: space-between; align-items: start;">
          <div>
            <strong>{{ note.user.username }}</strong>
            <small>{{ note.created_at|date:"Y-m-d H:i" }}</small>
          </div>
          {% if user == note.user %}
            <div>
              <a href="#" 
                hx-delete="{% url 'delete_note' note.id %}"
                hx-target="closest .notes-section"
                hx-swap="outerHTML"
                class="delete-note">
                <i class="fa-solid fa-trash pico-color-red-500"></i>
              </a>
            </div>
          {% endif %}
        </div>
        <p style="margin-top: 0.5em;">{{ note.content }}</p>
      </article>
    {% endfor %}
  {% else %}
    <p>No notes yet.</p>
  {% endif %}

  <form hx-post="{% url 'add_note' %}" 
        hx-target="closest .notes-section"
        hx-swap="outerHTML">
    <input type="hidden" name="content_type" value="{{ content_type }}">
    <input type="hidden" name="object_id" value="{{ object.id }}">
    <textarea name="content" placeholder="Add a note..." required style="margin: 0.5em 0;"></textarea>
    <button type="submit" class="outline">Add Note</button>
  </form>
</div>
