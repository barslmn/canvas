<div class="cnv-edit-result {% if success %}success{% else %}error{% endif %}">
    {{ message }}
</div>

{% if success %}
<div x-init="showCNVModal = false"></div>
<script>
document.addEventListener("DOMContentLoaded", () => {
    if (typeof table !== "undefined") {
        try {
            const newData = JSON.parse('{{ cnv_json|escapejs }}');
            newData.cnv_pk = "{{ cnv.pk }}";
            newData.VariantID = "{{ cnv.variant_id }}";

            // Update the table
            console.log("Current table data:", table.getData());
            console.log("Adding new CNV data:", newData);
            table.updateOrAddData([newData]);
            table.redraw(true);

            // Close modal after table update
            showCNVModal = false;
        } catch (e) {
            console.error("Error updating table:", e);
        }
    } else {
        console.error("Table is not defined");
    }
});

</script>
{% endif %}

<style>
    .cnv-edit-result {
        padding: 1em;
        margin: 1em 0;
        border-radius: 4px;
    }
    .cnv-edit-result.success {
        background-color: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
    }
    .cnv-edit-result.error {
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
    }
</style>
