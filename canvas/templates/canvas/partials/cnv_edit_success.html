<div class="cnv-edit-result {% if success %}success{% else %}error{% endif %}">
    {{ message }}
</div>

{% if success %}
  <div x-init="showCNVModal = false"></div>
  <script>
    table.updateData([
      {
        cnv_pk: "{{ cnv.pk }}",
        VariantID: "{{ cnv.variant_id }}",
        chr_info: "{{ cnv.cnv_json.chr_info }}",
        type: "{{ cnv.cnv_json.type }}",
        total_score: 0,
        Classification: "",  // Empty since it's a new CNV
        classification_pk: "",  // Empty since it's a new CNV
        addToReport: false
      }
    ]);
  </script>
{% endif %}

<style>
    .cnv-edit-result {
        padding: 1em;
        margin: 1em 0;
        border-radius: 4px;
    }
    .cnv-edit-result.success {
        background-color: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
    }
    .cnv-edit-result.error {
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
    }
</style>
