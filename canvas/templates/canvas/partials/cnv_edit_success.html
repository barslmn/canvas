<div class="cnv-edit-result {% if success %}success{% else %}error{% endif %}">
    {{ message }}
</div>

{% if success %}
<div x-init="showCNVModal = false; updateTableWithCNV();"></div>
<script>
function updateTableWithCNV() {
    if (typeof table !== "undefined") {
        try {
            // Prepare the new CNV data for table update
            const newCNVData = {
                cnv_pk: "{{ cnv.pk }}",
                VariantID: "{{ cnv.variant_id }}",
                Classification: "{{ cnv.cnv_json.Classification|default:''|escapejs }}",
                Total_score: "{{ cnv.cnv_json['Total score']|default:'0.00'|escapejs }}",
                Chromosome: "{{ cnv.cnv_json.Chromosome|escapejs }}",
                iscn: "{{ cnv.cnv_json.iscn|escapejs }}",
                Start: "{{ cnv.cnv_json.Start|escapejs }}",
                End: "{{ cnv.cnv_json.End|escapejs }}",
                Type: "{{ cnv.cnv_json.Type|escapejs }}",
                user_cnv: "{{ cnv.cnv_json.user_cnv|escapejs }}",
                user_copy_number: "{{ cnv.cnv_json.user_copy_number|escapejs }}",
                All_protein_coding_genes: "{{ cnv.cnv_json['All protein coding genes']|escapejs }}",
                Dosage_sensitive_genes: "{{ cnv.cnv_json['Known or predicted dosage-sensitive genes']|escapejs }}",
            };

            // Update the table with the new CNV data
            table.updateData([newCNVData]);
            console.log("CNV added to table immediately:", newCNVData);

            // Optionally redraw the table (if required by your table library)
            table.redraw(true);

            // Ensure modal close state
            showCNVModal = false;
        } catch (error) {
            console.error("Error updating table with new CNV data:", error);
        }
    } else {
        console.error("Table is not defined");
    }
}

document.addEventListener("DOMContentLoaded", () => {
    // Ensure the table is updated even if the modal closes late
    if (showCNVModal === false) {
        updateTableWithCNV();
    }
});
</script>
{% endif %}

<style>
    .cnv-edit-result {
        padding: 1em;
        margin: 1em 0;
        border-radius: 4px;
    }
    .cnv-edit-result.success {
        background-color: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
    }
    .cnv-edit-result.error {
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
    }
</style>
