<div class="cnv-edit-result {% if success %}success{% else %}error{% endif %}">
    {{ message }}
</div>

{% if success %}
<div x-init="showCNVModal = false"></div>
<script>
    // Create new row object with all the CNV data
    const newCNVData = {
        cnv_pk: "{{ cnv.pk }}",
        VariantID: "{{ cnv.cnv_json.VariantID }}",
        chr_info: "{{ cnv.cnv_json.user_cnv }}",
        state_info: "{{ cnv.cnv_json.state_info }}",
        total_score: "{{ cnv.cnv_json.Total score }}",
        Classification: "{{ cnv.cnv_json.Classification }}",
        length_info: "{{ cnv.cnv_json.length_info }}",
        numsnp_info: "{{ cnv.cnv_json.numsnp_info }}",
        Type: "{{ cnv.cnv_json.Type }}",
        addToReport: false
    };
    
    // Make sure table is defined before using it
    if (typeof table !== 'undefined') {
        // Add the new row to the table
        table.addData([newCNVData], true);

        // Get the newly added row
        const newRow = table.getRow(newCNVData);
        
        // Add click handler to navigate IGV
        if (newRow) {
            newRow.getElement().addEventListener('click', function() {
                const cnvPosition = newCNVData.chr_info;  // Format: chr:start-end
                if (typeof igv !== 'undefined' && igv.browser) {
                    igv.browser.search(cnvPosition);
                }
            });
        }
    } else {
        console.error('Table is not defined');
    }

    // Debug output to console
    console.log('New CNV Data:', newCNVData);
</script>
{% endif %}

<style>
    .cnv-edit-result {
        padding: 1em;
        margin: 1em 0;
        border-radius: 4px;
    }
    .cnv-edit-result.success {
        background-color: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
    }
    .cnv-edit-result.error {
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
    }
</style>
