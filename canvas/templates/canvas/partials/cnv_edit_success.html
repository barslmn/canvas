<div class="cnv-edit-result {% if success %}success{% else %}error{% endif %}">
    {{ message }}
</div>

{% if success %}
<div x-init="showCNVModal = false"></div>
<script>
    // First log the data to make sure it's correct
    console.log('Adding new CNV:', {
        cnv_pk: "{{ cnv.pk }}",
        VariantID: "{{ cnv.variant_id }}",
        chr_info: "{{ cnv.cnv_json.user_cnv }}",
        state_info: "{{ cnv.cnv_json.state_info }}",
        total_score: "{{ cnv.cnv_json.Total score }}",
        Classification: "{{ cnv.cnv_json.Classification }}",
        length_info: "{{ cnv.cnv_json.length_info }}",
        numsnp_info: "{{ cnv.cnv_json.numsnp_info }}"
    });

    // Make sure table exists and is ready
    if (typeof table !== 'undefined') {
        const newData = {
            cnv_pk: "{{ cnv.pk }}",
            VariantID: "{{ cnv.variant_id }}",
            chr_info: "{{ cnv.cnv_json.user_cnv }}",
            state_info: "{{ cnv.cnv_json.state_info }}",
            total_score: "{{ cnv.cnv_json.Total score }}",
            Classification: "{{ cnv.cnv_json.Classification }}",
            length_info: "{{ cnv.cnv_json.length_info }}",
            numsnp_info: "{{ cnv.cnv_json.numsnp_info }}",
            addToReport: false
        };

        try {
            // Get current data
            let currentData = table.getData();
            // Add new data
            currentData.push(newData);
            // Clear and set all data
            table.clearData();
            table.setData(currentData);
            // Force redraw
            table.redraw(true);
        } catch (e) {
            console.error('Error updating table:', e);
        }
    } else {
        console.error('Table is not defined');
    }
</script>
{% endif %}

<style>
    .cnv-edit-result {
        padding: 1em;
        margin: 1em 0;
        border-radius: 4px;
    }
    .cnv-edit-result.success {
        background-color: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
    }
    .cnv-edit-result.error {
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
    }
</style>
