<div class="cnv-edit-result {% if success %}success{% else %}error{% endif %}">
    {{ message }}
</div>

{% if success %}
<div x-init="showCNVModal = false"></div>
<script>
    // First log the data to make sure it's correct
    console.log('Adding new CNV:', {
        cnv_pk: "{{ cnv.pk }}",
        VariantID: "{{ cnv.variant_id }}",
        chr_info: "{{ cnv.cnv_json.user_cnv }}",
        state_info: "{{ cnv.cnv_json.state_info }}",
        total_score: "{{ cnv.cnv_json.Total score }}",
        Classification: "{{ cnv.cnv_json.Classification }}",
        length_info: "{{ cnv.cnv_json.length_info }}",
        numsnp_info: "{{ cnv.cnv_json.numsnp_info }}"
    });

    // Update the table with the new CNV data
    if (typeof table !== 'undefined') {
        try {
            const newData = JSON.parse('{{ cnv_json|escapejs }}');
            newData.cnv_pk = "{{ cnv.pk }}";
            newData.VariantID = "{{ cnv.variant_id }}";

            let currentData = table.getData();
            currentData.push(newData);
            table.clearData();
            table.setData(currentData);
            table.redraw(true);
        } catch (e) {
            console.error('Error updating table:', e);
        }
    } else {
        console.error('Table is not defined');
    }

    // Handle form submission using JavaScript
    document.querySelector("#cnvForm").addEventListener("submit", function (e) {
        e.preventDefault();
        const formData = new FormData(this);

        fetch(this.action, {
            method: "POST",
            body: formData,
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                const newData = JSON.parse(data.cnv_json);
                newData.cnv_pk = data.cnv_pk;
                newData.VariantID = data.variant_id;

                let currentData = table.getData();
                currentData.push(newData);
                table.clearData();
                table.setData(currentData);
                table.redraw(true);
            } else {
                console.error(data.message);
            }
        })
        .catch(error => console.error("Error:", error));
    });
</script>
{% endif %}

<style>
    .cnv-edit-result {
        padding: 1em;
        margin: 1em 0;
        border-radius: 4px;
    }
    .cnv-edit-result.success {
        background-color: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
    }
    .cnv-edit-result.error {
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
    }
</style>
